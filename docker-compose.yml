services:
  puslah-franken:
    container_name: puslah-franken
    restart: unless-stopped
    mem_limit: 1024m
    mem_reservation: 384m
    environment:
      - PUID=1000
      - PGID=1000
      - SERVER_NAME=:80
      - PHP_INI_MEMORY_LIMIT=256M
      - PHP_INI_MAX_EXECUTION_TIME=300
      - MAX_REQUESTS=500
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8089:80"
    volumes:
      - .:/app
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - .:/var/www/html
    networks:
      - default
      - mysql-stack_mysql_network

  puslah-worker:
    container_name: puslah-worker
    restart: unless-stopped
    mem_limit: 512m
    healthcheck:
      disable: true
    build:
      context: .
      dockerfile: Dockerfile
    command: php artisan queue:work --sleep=3 --tries=3 --timeout=600 --max-jobs=500
    volumes:
      - .:/app
    networks:
      - default
      - mysql-stack_mysql_network

  puslah-scheduler:
    container_name: puslah-scheduler
    restart: unless-stopped
    mem_limit: 256m
    healthcheck:
      disable: true
    build:
      context: .
      dockerfile: Dockerfile
    command: php artisan schedule:work
    volumes:
      - .:/app
    networks:
      - default
      - mysql-stack_mysql_network

networks:
  default: {}
  mysql-stack_mysql_network:
    external: true