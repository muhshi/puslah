services:
  puslah-redis:
    container_name: puslah-redis
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 96mb --maxmemory-policy allkeys-lru
    mem_limit: 128m
    volumes:
      - redis-data:/data
    networks:
      - default

  puslah-franken:
    container_name: puslah-franken
    restart: unless-stopped
    mem_limit: 1024m
    mem_reservation: 384m
    depends_on:
      - puslah-redis
    environment:
      - PUID=1000
      - PGID=1000
      - SERVER_NAME=:80
      - PHP_INI_MEMORY_LIMIT=256M
      - PHP_INI_MAX_EXECUTION_TIME=300
      - MAX_REQUESTS=500
      - REDIS_HOST=puslah-redis
      - REDIS_PORT=6379
      - REDIS_CLIENT=phpredis
      - CACHE_STORE=redis
      - SESSION_DRIVER=redis
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8089:80"
    volumes:
      - .:/app
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - .:/var/www/html
    networks:
      - default
      - mysql-stack_mysql_network

  puslah-worker:
    container_name: puslah-worker
    restart: unless-stopped
    mem_limit: 512m
    healthcheck:
      disable: true
    depends_on:
      - puslah-redis
    environment:
      - REDIS_HOST=puslah-redis
      - REDIS_PORT=6379
      - REDIS_CLIENT=phpredis
      - CACHE_STORE=redis
      - SESSION_DRIVER=redis
    build:
      context: .
      dockerfile: Dockerfile
    command: php artisan queue:work --sleep=3 --tries=3 --timeout=600 --max-jobs=500
    volumes:
      - .:/app
    networks:
      - default
      - mysql-stack_mysql_network

  puslah-scheduler:
    container_name: puslah-scheduler
    restart: unless-stopped
    mem_limit: 256m
    healthcheck:
      disable: true
    depends_on:
      - puslah-redis
    environment:
      - REDIS_HOST=puslah-redis
      - REDIS_PORT=6379
      - REDIS_CLIENT=phpredis
      - CACHE_STORE=redis
      - SESSION_DRIVER=redis
    build:
      context: .
      dockerfile: Dockerfile
    command: php artisan schedule:work
    volumes:
      - .:/app
    networks:
      - default
      - mysql-stack_mysql_network

volumes:
  redis-data: {}

networks:
  default: {}
  mysql-stack_mysql_network:
    external: true